name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Test
        # Tests are offline: no network, no broker, no runtime folder.
        run: pytest -q
        env:
          UPSTOX_RUNTIME_DIR: ${{ runner.temp }}/upstox_runtime
